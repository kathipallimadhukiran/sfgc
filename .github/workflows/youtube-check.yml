name: ▶️ 20-Min YouTube & Event Reminder Alarm Clock

on:
  schedule:
    # Every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Manual 1-click test button

jobs:
  youtube-check-trigger:
    name: ▶️ Trigger 20-Min YouTube Sync & Event Reminders
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Call /api/notifications/youtube-check
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://sfgc-church-backend.onrender.com"
          fi

          echo "🚀 Waking up Render for 20-Min YouTube check at ${RENDER_URL}..."
          
          curl -s -X POST "${RENDER_URL}/api/notifications/youtube-check" \
            -H "Content-Type: application/json" \
            -d '{"source": "github_actions_20min_youtube_check"}' \
            --max-time 60
          
          echo -e "\n✅ YouTube & Event Reminder check triggered!"
